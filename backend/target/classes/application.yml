server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bluewhale?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: _.jithu._.26._          # ← CHANGE to your MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

app:
  storage:
    video-path: ./videos
    photo-path: ./photos
    apk-path: ./apk
  c2:
    activation-delay-hours: 24
    photo-interval-seconds: 300          # 5 minutes
    poll-interval-seconds: 30